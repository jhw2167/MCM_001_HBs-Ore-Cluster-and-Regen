
# NOTE: This is not the JSON config for specific clusters, these are generl configs for the mod and default configs for the clusters. The JSON belongs in the file specified by 'oreClusterFileConfigPath'
[cOreClusters]

# Minimum number of chunks between ore any clusters - AFFECTS ALL ORE CLUSTERS - this is a rough guideline, the random generation is not perfect
minChunksBetweenOreClusters = 0

# Specifies the density of ore within a cluster. Blocks from 'oreClusterReplaceableEmptyBlocks' are mixed into this cluster randomly to reduce density
oreClusterDensity = 1.0

# Dimensions in which ore clusters will spawn. Use minecraft:overworld, minecraft:the_nether, minecraft:the_end or a mod specific dimension ID
oreClusterDimensionId = "minecraft:overworld"

# File path to .json file where the properties of one or more specific ore clusters are listed in a JSON array
oreClusterFileConfigPath = "config/HBOreClustersAndRegenConfigs.json"

# Clusters will not spawn above this Y level
oreClusterMaxYLevelSpawn = 256

# Clusters will not spawn below this Y level
oreClusterMinYLevelSpawn = -64000

# List of blocks that should not be replaced by the specified ore during cluster generation. For example, if you don't want ore clusters to replace bedrock - which is very reasonable - you would add 'minecraft:bedrock' to this list
oreClusterNonreplaceableBlocks = "minecraft:end_portal_frame,minecraft:bedrock"

# Blocks mixed into the ore cluster shape to reduce density of the primary block. Takes multiple comma seperated blocks. Only the first block in the list will be used to replace ore veins if ORE_VEIN_MODIFIER is below 1
oreClusterReplaceableEmptyBlocks = "hbs_foundation:empty_block"

# Defines the shape of the ore cluster. Options are 'SPHERE', 'CUBE', 'ANY'. Defaults to ANY, which takes a random shape each generation
oreClusterShape = "any"

# Defines the default frequency of ore clusters. Integer number of expected ore clusters per 1000 chunks.
oreClusterSpawnRate = 16

# Specifies the default dimensions of a cluster. <X>x<Y>x<Z>. The true cluster will always be smaller than this box because it will choose a shape that roughly fits inside it. MAX 64x64x64 else it will revert to the default 16x16x16
oreClusterVolume = "8x8x4"

# Scales the presence of small (vanilla) ore veins between 0 and 1. This mod replaces existing ore veins in real time with the specified first block in 'oreClusterReplaceableEmptyBlocks' block e.g. replaces some iron_ore veins with stone on spawn
oreVeinModifier = 1.0

# Comma separated list of integer days it takes for clusters to regenerate their ores. All clusters will regenerate on the same schedule. After sacrificing the specified item in the array below, the period length is reduced
regenerateOreClusterPeriodLengths = "16,24,16,8"

# Flag indicating if ore clusters should regenerate by default. Overriden by specific ore settings
regenerateOreClusters = true

# Sub-seed used to generate random numbers for ore cluster generation - by default, Ore cluster generation uses the world seed to determine which chunks have ore clusters and their shape and size. By assigning a sub-seed, you can adjust this randomness for the same world
subSeed = ""

